name: Transfer Fitness Command Center v1.1.5

permissions:
  contents: write

on:
  push:
    branches: [ fitness-command-center-v1-1-build ]
    paths:
      - '.github/workflows/transfer-v115.yml'
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published files
        run: |
          test -f release-v115-built/Fitness_Performance_Command_Center_v1.1.5.apk
          test -f release-v115-built/Fitness_Command_Center_v1.1.5_Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Fitness-Command-Center-v1.1.5-transfer
          path: |
            release-v115-built/Fitness_Performance_Command_Center_v1.1.5.apk
            release-v115-built/Fitness_Command_Center_v1.1.5_Source.zip
            release-v115-built/apk-verification.txt
          retention-days: 30
      - name: Publish transfer run id
        shell: bash
        run: |
          printf '%s\n' '${{ github.run_id }}' > release-v115-built/transfer-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-v115-built/transfer-run-id.txt
          git commit -m 'Record v1.1.5 transfer workflow run' || true
          git push origin HEAD:fitness-command-center-v1-1-build
