name: Build Fitness Command Center v1.1.2

on:
  push:
    branches: [ fitness-command-center-v1-1-build ]
    paths:
      - 'fitness-source-parts/**'
      - 'fitness-signing-key.b64'
      - 'release-v112/**'
      - '.github/workflows/fitness-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0' || true

      - name: Reconstruct source and apply v1.1.2 update
        shell: bash
        run: |
          set -euo pipefail
          cat fitness-source-parts/part-* > fitness-source.b64
          base64 -d fitness-source.b64 > fitness-android-source.zip
          unzip -t fitness-android-source.zip
          rm -rf fitness-android
          mkdir fitness-android
          unzip -q fitness-android-source.zip -d fitness-android
          python3 release-v112/patch.py fitness-android
          cp release-v112/addon.js fitness-android/app/src/main/assets/addon.js
          node --check fitness-android/app/src/main/assets/addon.js
          grep -n 'versionCode\|versionName' fitness-android/app/build.gradle
          grep -n 'readHealthDate\|average_heart_rate_bpm' fitness-android/app/src/main/java/com/david/fitnesscommandcenter/v2/MainActivity.kt | head
          grep -n 'Daily activity & progress\|oldWeeklyReport' fitness-android/app/src/main/assets/addon.js | head
          grep -n 'android:icon\|android:roundIcon' fitness-android/app/src/main/AndroidManifest.xml

      - name: Build unsigned release
        working-directory: fitness-android
        run: gradle --no-daemon clean assembleRelease

      - name: Package source backup
        shell: bash
        run: |
          cd fitness-android
          zip -qr ../Fitness_Command_Center_v1.1.2_Source.zip .

      - name: Sign APK with preserved v1.1 key
        shell: bash
        run: |
          set -euo pipefail
          PASS='FCC-v1.1-2026-Private-Key'
          base64 -d fitness-signing-key.b64 > fitness-command-center-v1.1-signing.jks
          keytool -list -v -keystore fitness-command-center-v1.1-signing.jks -storepass "$PASS" -alias fitnesscommandcenter | grep -E 'SHA256:|Owner:' | head
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            fitness-android/app/build/outputs/apk/release/app-release-unsigned.apk \
            Fitness_Performance_Command_Center_v1.1.2-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks fitness-command-center-v1.1-signing.jks \
            --ks-key-alias fitnesscommandcenter \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out Fitness_Performance_Command_Center_v1.1.2.apk \
            Fitness_Performance_Command_Center_v1.1.2-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Fitness_Performance_Command_Center_v1.1.2.apk | tee apk-verification.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Fitness-Command-Center-v1.1.2
          path: |
            Fitness_Performance_Command_Center_v1.1.2.apk
            Fitness_Command_Center_v1.1.2_Source.zip
            apk-verification.txt
          retention-days: 30
