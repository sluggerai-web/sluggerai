name: Build Fitness Command Center v1.1.5

on:
  push:
    branches: [ fitness-command-center-v1-1-build ]
    paths:
      - 'fitness-source-parts/**'
      - 'fitness-signing-key.b64'
      - 'release-v112/**'
      - 'release-v113/**'
      - 'release-v114/**'
      - 'release-v115/**'
      - '.github/workflows/fitness-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0' || true

      - name: Reconstruct source and apply v1.1.5 update
        shell: bash
        run: |
          set -euo pipefail
          cat fitness-source-parts/part-* > fitness-source.b64
          base64 -d fitness-source.b64 > fitness-android-source.zip
          unzip -t fitness-android-source.zip
          rm -rf fitness-android
          mkdir fitness-android
          unzip -q fitness-android-source.zip -d fitness-android
          python3 release-v112/patch.py fitness-android
          cp release-v112/addon.js fitness-android/app/src/main/assets/addon.js
          python3 release-v113/patch.py fitness-android
          cp release-v113/reportaddon.js fitness-android/app/src/main/assets/reportaddon.js
          python3 release-v114/patch.py fitness-android
          python3 release-v115/patch.py fitness-android
          cp release-v115/historyaddon.js fitness-android/app/src/main/assets/historyaddon.js
          node --check fitness-android/app/src/main/assets/addon.js
          node --check fitness-android/app/src/main/assets/reportaddon.js
          node --check fitness-android/app/src/main/assets/historyaddon.js
          grep -n 'versionCode\|versionName' fitness-android/app/build.gradle
          grep -n 'historyaddon.js' fitness-android/app/src/main/assets/index.html
          grep -n 'openFoodForDate\|openTrainingForDate\|editMeal\|editWorkout' fitness-android/app/src/main/assets/historyaddon.js | head

      - name: Verify Eastern timezone rollover fix
        shell: bash
        run: |
          TZ=America/New_York node - <<'NODE'
          function localISODate(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
          const at811pmEastern = new Date('2026-08-13T00:11:00Z');
          const got = localISODate(at811pmEastern);
          console.log('America/New_York at 2026-08-13T00:11Z ->', got);
          if (got !== '2026-08-12') throw new Error('Timezone regression: expected Aug 12 local date');
          NODE

      - name: Verify historical date controls
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('fitness-android/app/src/main/assets/historyaddon.js','utf8');
          const required=['validEntryDate','setEntryDate','saveManualMeal','saveManualWorkout','editMeal','editWorkout','deleteMeal','deleteWorkout','startVoiceForDate'];
          for (const n of required) if (!s.includes(n)) throw new Error('Missing historical-edit function: '+n);
          if (!s.includes('max="${today()}"')) throw new Error('Historical date inputs do not block future dates');
          console.log('Historical meal/workout controls present');
          NODE

      - name: Build unsigned release
        working-directory: fitness-android
        run: gradle --no-daemon clean assembleRelease

      - name: Package source backup
        shell: bash
        run: |
          cd fitness-android
          zip -qr ../Fitness_Command_Center_v1.1.5_Source.zip .

      - name: Sign APK with preserved v1.1 key
        shell: bash
        run: |
          set -euo pipefail
          PASS='FCC-v1.1-2026-Private-Key'
          base64 -d fitness-signing-key.b64 > fitness-command-center-v1.1-signing.jks
          keytool -list -v -keystore fitness-command-center-v1.1-signing.jks -storepass "$PASS" -alias fitnesscommandcenter | grep -E 'SHA256:|Owner:' | head
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            fitness-android/app/build/outputs/apk/release/app-release-unsigned.apk \
            Fitness_Performance_Command_Center_v1.1.5-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks fitness-command-center-v1.1-signing.jks \
            --ks-key-alias fitnesscommandcenter \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out Fitness_Performance_Command_Center_v1.1.5.apk \
            Fitness_Performance_Command_Center_v1.1.5-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Fitness_Performance_Command_Center_v1.1.5.apk | tee apk-verification.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Fitness-Command-Center-v1.1.5
          path: |
            Fitness_Performance_Command_Center_v1.1.5.apk
            Fitness_Command_Center_v1.1.5_Source.zip
            apk-verification.txt
          retention-days: 30
